<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梁氏明芳 | 個人名片</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-500 via-purple-500 to-orange-400 min-h-screen flex items-center justify-center p-4">
    
    <!-- 極簡毛玻璃名片主體 -->
    <main class="max-w-sm w-full bg-white/40 backdrop-blur-2xl border border-white/60 rounded-[2.5rem] shadow-2xl p-8 text-center relative overflow-hidden">
        
        <!-- 卡片內的光暈裝飾效果 -->
        <div class="absolute -top-20 -right-20 w-40 h-40 bg-pink-400 rounded-full mix-blend-multiply filter blur-2xl opacity-70"></div>
        <div class="absolute -bottom-20 -left-20 w-40 h-40 bg-orange-400 rounded-full mix-blend-multiply filter blur-2xl opacity-70"></div>
        
        <!-- 內容區 -->
        <div class="relative z-10">
            <!-- 唯一照片放置區 (更改 src 即可替換照片) -->
            <img src="001.jpg" class="w-32 h-32 mx-auto rounded-full border-4 border-white shadow-xl object-cover mb-5 hover:scale-105 transition-transform duration-300">
            
            <!-- 基本資訊 -->
            <div class="inline-block px-3 py-1 bg-white/70 text-purple-800 text-xs font-bold rounded-full mb-3 shadow-sm">
                黎明學園數媒系
            </div>
            <h1 class="text-3xl font-black text-gray-900 mb-3 tracking-wide">梁氏明芳</h1>
            <p class="text-sm text-gray-800 font-medium mb-6 px-2 leading-relaxed">
                「喜歡簡單生活，也喜歡認真對待每一件事。」
            </p>
            
            <!-- 興趣與技能 (小膠囊標籤) -->
            <div class="space-y-4 mb-8">
                <div class="flex flex-wrap justify-center gap-2">
                    <span class="px-3 py-1 bg-white/70 text-pink-600 text-xs font-bold rounded-full shadow-sm"><i class="fa-solid fa-film mr-1"></i> 看電影</span>
                    <span class="px-3 py-1 bg-white/70 text-purple-600 text-xs font-bold rounded-full shadow-sm"><i class="fa-solid fa-bed mr-1"></i> 睡覺</span>
                    <span class="px-3 py-1 bg-white/70 text-orange-600 text-xs font-bold rounded-full shadow-sm"><i class="fa-solid fa-utensils mr-1"></i> 做飯</span>
                </div>
                <div class="flex flex-wrap justify-center gap-2">
                    <span class="px-3 py-1 bg-white/70 text-blue-600 text-xs font-bold rounded-full shadow-sm"><i class="fa-solid fa-code mr-1"></i> 寫代碼</span>
                    <span class="px-3 py-1 bg-white/70 text-indigo-600 text-xs font-bold rounded-full shadow-sm"><i class="fa-solid fa-calculator mr-1"></i> 微積分</span>
                </div>
            </div>
            
            <!-- 聯絡方式區塊 (直覺式按鈕) -->
            <div class="space-y-3">
                <!-- Email -->
                <a href="mailto:luongminhphuong2006@gmail.com" class="flex items-center justify-center gap-3 w-full py-3 bg-white/80 hover:bg-white text-gray-800 rounded-2xl shadow-sm hover:shadow-md transition-all duration-300">
                    <i class="fa-solid fa-envelope text-pink-500 text-lg"></i>
                    <span class="text-sm font-bold truncate">luongminhphuong2006@gmail.com</span>
                </a>
                
                <!-- Line & IG 雙拼排版 -->
                <div class="flex gap-3">
                    <div class="flex-1 flex items-center justify-center gap-2 py-3 bg-white/80 hover:bg-white text-gray-800 rounded-2xl shadow-sm hover:shadow-md transition-all duration-300 cursor-pointer">
                        <i class="fa-brands fa-line text-green-500 text-lg"></i>
                        <span class="text-xs font-bold truncate">phuongxinggai27</span>
                    </div>
                    <div class="flex-1 flex items-center justify-center gap-2 py-3 bg-white/80 hover:bg-white text-gray-800 rounded-2xl shadow-sm hover:shadow-md transition-all duration-300 cursor-pointer">
                        <i class="fa-brands fa-instagram text-purple-500 text-lg"></i>
                        <span class="text-xs font-bold truncate">_min_phuw_27</span>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
